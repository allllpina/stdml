name: API Gateway CI

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'services/api_gateway/**'
  push:
    branches: [ "main" ]
    paths:
      - 'services/api_gateway/**'

jobs:
  test-api:
    name: Lint and Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/api_gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Linters (Ruff)
        run: uv run ruff check .

      - name: Run Type Checks (Mypy)
        run: uv run mypy .

      # Uncomment after addition of tests
      # - name: Run Pytest
      #   run: uv run pytest tests/