[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worker"
version = "0.1.0"
description = "Main worker service for the MLOps platform"
requires-python = ">=3.12"
dependencies = [
    "feast>=0.66.0",
    "mlflow>=3.15.1",
    "pandas>=2.3.3",
    "pandas-stubs>=3.0.5.260730",
    "pydantic>=2.13.4",
    "redis>=8.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
